<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mikami Sushi — Relatório Toritama</title>
  <link rel="icon" href="img/logo123.jpg">

  <!--
    SEGURANÇA: mesma senha de acesso ao relatório da matriz.
    Pra trocar por outra só de Toritama (Node.js):
      require('crypto').createHash('sha256').update('SUA_SENHA').digest('hex')
    e cole o resultado no content= abaixo.
  -->
  <meta name="report-hash-toritama" content="205f9391ddcc5158c52ff55a811710667fee6225bbcbe83e25d94bdb1cbfcdc4">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-relatorio-toritama">

  <header class="main-header">
    <div class="header-brand">
      <img src="img/logo123.jpg" alt="Mikami Sushi" class="brand-logo"
        onerror="this.style.display='none';this.nextElementSibling.style.display='block'" />
      <span class="kanji" style="display:none">御</span>
      <div class="brand-text">
        <h1>Mikami Sushi</h1>
        <p class="brand-sub">Toritama · Relatório</p>
      </div>
      <button class="filial-btn" id="btnFilial">📍 <strong>Toritama</strong> <span class="filial-caret">▾</span></button>
    </div>
    <nav class="main-nav">
      <a href="toritama.html" class="nav-link">Comandas</a>
      <a href="relatorio-toritama.html" class="nav-link active">Relatório</a>
    </nav>
    <div class="header-clock" id="headerClock"></div>
  </header>

  <div class="modal-overlay" id="modalFilial">
    <div class="modal-box" style="max-width:320px">
      <h3>Selecionar Filial</h3>
      <div class="filial-opcoes">
        <button class="filial-opcao" data-href="index.html">🏠 Centro</button>
        <button class="filial-opcao ativa" data-href="toritama.html">🏢 Toritama <span class="filial-opcao-check">✓</span></button>
      </div>
      <div class="modal-acoes">
        <button class="btn-secondary" id="btnCancelarFilial">Cancelar</button>
      </div>
    </div>
  </div>

  <main class="site-main">

    <!-- LOGIN -->
    <div class="site-card" id="relatorioLoginToritama" style="max-width:380px">
      <div class="login-icon">🔐</div>
      <h2 style="text-align:center;margin:0.4rem 0 0.2rem">Área Restrita</h2>
      <p class="site-desc" style="text-align:center">Digite a senha para acessar o relatório de Toritama.</p>
      <form id="formLoginRelatorioToritama">
        <input
          type="password"
          id="senhaRelatorioToritama"
          class="site-produtos-busca"
          placeholder="Senha"
          autocomplete="off"
        />
        <button type="submit" class="site-btn site-btn--abrir" style="width:100%;margin-top:0.6rem">Entrar</button>
      </form>
      <div class="login-erro" id="loginErroToritama" style="text-align:center;color:var(--vermelho-vivo);font-size:0.78rem;margin-top:0.6rem"></div>
    </div>

    <!-- CONTEÚDO -->
    <div id="relatorioConteudoToritama" class="hidden" style="width:100%;max-width:720px">

      <div class="fat-resumo fat-resumo--toritama">
        <div class="fat-card">
          <span class="fat-label">Hoje</span>
          <strong class="fat-valor" id="resHojeValor">R$ 0,00</strong>
          <span class="fat-label" id="resHojeCount">0 venda(s)</span>
        </div>
        <div class="fat-card">
          <span class="fat-label">Últimos 7 dias</span>
          <strong class="fat-valor" id="resSemanaValor">R$ 0,00</strong>
          <span class="fat-label" id="resSemanaCount">0 venda(s)</span>
        </div>
        <div class="fat-card">
          <span class="fat-label">Últimos 30 dias</span>
          <strong class="fat-valor" id="resMesValor">R$ 0,00</strong>
          <span class="fat-label" id="resMesCount">0 venda(s)</span>
        </div>
      </div>

      <h2 class="site-produtos-title" style="margin:1.4rem 0 0.8rem">Vendas</h2>
      <div id="listaVendasToritama" class="vendas-lista"></div>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="toritama.html" class="bottom-nav-item">Comandas</a>
    <a href="relatorio-toritama.html" class="bottom-nav-item active">Relatório</a>
  </nav>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="app-toritama.js"></script>
</body>
</html>
