<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mikami Sushi — Toritama</title>
  <link rel="icon" href="img/logo123.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-toritama">

  <header class="main-header">
    <div class="header-brand">
      <img src="img/logo123.jpg" alt="Mikami Sushi" class="brand-logo"
        onerror="this.style.display='none';this.nextElementSibling.style.display='block'" />
      <span class="kanji" style="display:none">御</span>
      <div class="brand-text">
        <h1>Mikami Sushi</h1>
        <p class="brand-sub">Toritama · Comandas</p>
      </div>
      <button class="filial-btn" id="btnFilial">📍 <strong>Toritama</strong> <span class="filial-caret">▾</span></button>
    </div>
    <nav class="main-nav">
      <a href="toritama.html" class="nav-link active">Comandas</a>
      <a href="relatorio-toritama.html" class="nav-link">Relatório</a>
    </nav>
    <div class="header-clock" id="headerClock"></div>
  </header>

  <div class="modal-overlay" id="modalFilial">
    <div class="modal-box" style="max-width:320px">
      <h3>Selecionar Filial</h3>
      <div class="filial-opcoes">
        <button class="filial-opcao" data-href="index.html">🏠 Centro</button>
        <button class="filial-opcao ativa" data-href="toritama.html">🏢 Toritama <span class="filial-opcao-check">✓</span></button>
      </div>
      <div class="modal-acoes">
        <button class="btn-secondary" id="btnCancelarFilial">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-label">Comandas ocupadas</span>
      <span class="stat-value" id="statComandasOcupadas">0 / 10</span>
    </div>
  </div>

  <main class="mesas-main">
    <div class="mesas-grid" id="comandasGrid"></div>
  </main>

  <nav class="bottom-nav">
    <a href="toritama.html" class="bottom-nav-item active">Comandas</a>
    <a href="relatorio-toritama.html" class="bottom-nav-item">Relatório</a>
  </nav>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="app-toritama.js"></script>
</body>
</html>
